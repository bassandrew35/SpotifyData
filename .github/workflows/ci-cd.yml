name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate AWS deployment settings
        env:
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EB_APPLICATION_NAME: ${{ vars.EB_APPLICATION_NAME }}
          EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME }}
          EB_S3_BUCKET: ${{ vars.EB_S3_BUCKET }}
        run: |
          if [ -z "$AWS_ROLE_TO_ASSUME" ] || [ -z "$AWS_REGION" ] || \
             [ -z "$EB_APPLICATION_NAME" ] || [ -z "$EB_ENVIRONMENT_NAME" ] || \
             [ -z "$EB_S3_BUCKET" ]; then
            echo "Configure AWS_ROLE_TO_ASSUME, AWS_REGION, EB_APPLICATION_NAME, EB_ENVIRONMENT_NAME, and EB_S3_BUCKET as GitHub repository variables."
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy to Elastic Beanstalk
        env:
          EB_APPLICATION_NAME: ${{ vars.EB_APPLICATION_NAME }}
          EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME }}
          EB_S3_BUCKET: ${{ vars.EB_S3_BUCKET }}
        run: |
          set -euo pipefail
          version_label="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          s3_key="source-bundles/${version_label}.zip"

          git archive --format=zip --output="$RUNNER_TEMP/source.zip" "$GITHUB_SHA"
          aws s3 cp "$RUNNER_TEMP/source.zip" "s3://${EB_S3_BUCKET}/${s3_key}"
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION_NAME" \
            --version-label "$version_label" \
            --source-bundle "S3Bucket=${EB_S3_BUCKET},S3Key=${s3_key}" \
            --process
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT_NAME" \
            --version-label "$version_label"
          aws elasticbeanstalk wait environment-updated \
            --environment-names "$EB_ENVIRONMENT_NAME"